name: Voyager

services:
  mongodb:
    image: mongo:8.0
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: development
    image: voyager-backend:dev

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: mongodb://mongodb:27017/voyager
      FRONTEND_URL: http://localhost:5173

    ports:
      - "3000:3000"

    volumes:
      - ./backend/src:/app/src

    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
      args:
        VITE_API_BASE_URL: http://localhost:3000
    image: voyager-frontend:dev

    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: http://localhost:3000

    ports:
      - "5173:5173"

    volumes:
      - ./frontend/src:/app/src

    depends_on:
      - backend

volumes:
  mongodb_data:
