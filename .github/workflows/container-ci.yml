name: Container CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test_containers:
    name: Test Container Images
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.0
        ports:
          # host:container
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Checkout the repository so the Dockerfiles and application code are available.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Build and run the frontend test image.
      - name: Build frontend test image
        run: |
          docker build \
            --target test \
            --tag voyager-frontend:test \
            ./frontend

      - name: Run frontend tests
        run: docker run --rm voyager-frontend:test

      # Build and run the backend test image.
      - name: Build backend test image
        run: |
          docker build \
            --target test \
            --tag voyager-backend:test \
            ./backend

      - name: Run backend tests
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          docker run --rm \
            --network host \
            -e NODE_ENV=test \
            -e JWT_SECRET_KEY \
            -e DATABASE_URL=mongodb://127.0.0.1:27017/voyager_test \
            voyager-backend:test

  publish_images:
    name: Publish Production Images
    needs: test_containers
    runs-on: ubuntu-latest

    # Publish automatically from main, or when the workflow is run manually.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    permissions:
      contents: read
      packages: write

    env:
      APP_VERSION: "1.0.0"
      REGISTRY: ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prepare image metadata
        id: image_meta
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Enable emulation so Buildx can build ARM64 images on the AMD64 GitHub runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend production image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_meta.outputs.owner_lc }}/voyager-backend:v${{ env.APP_VERSION }}-prod-${{ steps.image_meta.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ steps.image_meta.outputs.owner_lc }}/voyager-backend:v${{ env.APP_VERSION }}-prod
            ${{ env.REGISTRY }}/${{ steps.image_meta.outputs.owner_lc }}/voyager-backend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}

      - name: Build and push frontend production image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_API_BASE_URL=http://localhost:3000
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_meta.outputs.owner_lc }}/voyager-frontend:v${{ env.APP_VERSION }}-prod-${{ steps.image_meta.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ steps.image_meta.outputs.owner_lc }}/voyager-frontend:v${{ env.APP_VERSION }}-prod
            ${{ env.REGISTRY }}/${{ steps.image_meta.outputs.owner_lc }}/voyager-frontend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}
